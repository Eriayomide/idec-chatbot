<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IDEC Chatbot - Tosan Support Assistant</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: #eef1f3;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* ── Standalone mode (direct URL access) ────── */
      .chat-container {
        width: 100%;
        max-width: 420px;
        height: 92vh;
        max-height: 680px;
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        position: relative;
      }

      /* ── When inside an iframe (widget mode) ────── */
      body.in-iframe {
        background: #fff;
      }

      body.in-iframe .chat-container {
        max-width: 100%;
        width: 100%;
        height: 100vh;
        max-height: 100vh;
        border-radius: 0;
        box-shadow: none;
      }

      body.in-iframe .chat-header {
        display: none;
      }

      /* ── Header (only visible standalone) ────────── */
      .chat-header {
        background: linear-gradient(135deg, #5a7a8a 0%, #4a6a7a 100%);
        color: #fff;
        padding: 14px 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-shrink: 0;
      }

      .header-left {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .avatar-container {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        overflow: hidden;
        border: 2px solid rgba(255, 255, 255, 0.3);
        background: rgba(255, 255, 255, 0.15);
        flex-shrink: 0;
      }

      .avatar-container img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .avatar-fallback {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 16px;
        font-weight: 600;
      }

      .header-info h1 {
        font-size: 15px;
        font-weight: 600;
        line-height: 1.2;
      }

      .header-info p {
        font-size: 11px;
        opacity: 0.85;
        margin-top: 1px;
      }

      .status-dot {
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #4ade80;
        margin-right: 4px;
        animation: pulse 2s infinite;
      }

      .status-dot.off {
        background: #ef4444;
        animation: none;
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }

      .reset-btn {
        background: rgba(255, 255, 255, 0.15);
        border: 1px solid rgba(255, 255, 255, 0.25);
        color: #fff;
        padding: 6px 12px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 12px;
        font-weight: 500;
        transition: background 0.2s;
      }

      .reset-btn:hover {
        background: rgba(255, 255, 255, 0.25);
      }

      /* ── Messages area ──────────────────────────── */
      .messages-area {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        background: #f7f8fa;
      }

      .messages-area::-webkit-scrollbar { width: 4px; }
      .messages-area::-webkit-scrollbar-track { background: transparent; }
      .messages-area::-webkit-scrollbar-thumb {
        background: #ccc;
        border-radius: 4px;
      }

      /* ── Message bubbles ─────────────────────────── */
      .msg {
        margin-bottom: 12px;
        display: flex;
        animation: slideUp 0.25s ease;
      }

      @keyframes slideUp {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .msg.user { justify-content: flex-end; }

      .msg.bot {
        justify-content: flex-start;
        align-items: flex-start;
        gap: 8px;
      }

      .msg.system { justify-content: center; }

      .bot-av {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        overflow: hidden;
        flex-shrink: 0;
        margin-top: 2px;
        border: 1.5px solid #c8d3da;
        background: #fff;
      }

      .bot-av img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .bot-av-fb {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #5a7a8a, #4a6a7a);
        color: #fff;
        font-size: 12px;
        font-weight: 600;
      }

      .bubble {
        max-width: 78%;
        padding: 10px 14px;
        border-radius: 16px;
        font-size: 13.5px;
        line-height: 1.5;
        word-wrap: break-word;
      }

      .msg.user .bubble {
        background: linear-gradient(135deg, #5a7a8a 0%, #4a6a7a 100%);
        color: #fff;
        border-bottom-right-radius: 4px;
      }

      .msg.bot .bubble {
        background: #fff;
        color: #333;
        border-bottom-left-radius: 4px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
      }

      .msg.system .bubble {
        background: #fef3c7;
        color: #92400e;
        font-size: 11px;
        max-width: 90%;
        padding: 6px 12px;
        border-radius: 8px;
      }

      .bubble a {
        color: #0066cc;
        text-decoration: underline;
        font-weight: 500;
      }

      .bubble a:hover {
        color: #004fa3;
      }

      /* ── Typing dots ─────────────────────────────── */
      .typing-dots {
        padding: 10px 14px;
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
        display: inline-flex;
        gap: 4px;
        border-bottom-left-radius: 4px;
      }

      .typing-dots span {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #a0b0ba;
        animation: bounce 1.4s infinite;
      }

      .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
      .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

      @keyframes bounce {
        0%, 60%, 100% { transform: translateY(0); }
        30% { transform: translateY(-8px); }
      }

      /* ── Input bar ───────────────────────────────── */
      .input-bar {
        padding: 12px 14px;
        background: #fff;
        border-top: 1px solid #eee;
        flex-shrink: 0;
      }

      .input-row {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      #user-input {
        flex: 1;
        padding: 10px 14px;
        border: 1.5px solid #e0e4e8;
        border-radius: 20px;
        font-size: 13.5px;
        outline: none;
        transition: border-color 0.2s;
        font-family: inherit;
      }

      #user-input:focus {
        border-color: #5a7a8a;
      }

      #user-input:disabled {
        background: #fafafa;
        cursor: not-allowed;
      }

      #send-btn {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        border: none;
        background: linear-gradient(135deg, #5a7a8a 0%, #4a6a7a 100%);
        color: #fff;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.15s;
        flex-shrink: 0;
      }

      #send-btn:hover:not(:disabled) { transform: scale(1.08); }
      #send-btn:active { transform: scale(0.93); }
      #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

      /* ── Powered-by footer (widget mode only) ───── */
      .powered-by {
        display: none;
        text-align: center;
        padding: 5px;
        font-size: 10px;
        color: #bbb;
        background: #fff;
        border-top: 1px solid #f0f0f0;
        flex-shrink: 0;
      }

      body.in-iframe .powered-by {
        display: block;
      }

      /* ── Custom Confirm Modal ────────────────────── */
      .modal-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 100;
      }

      .modal-overlay.active {
        display: flex;
      }

      .modal-box {
        background: #fff;
        border-radius: 14px;
        padding: 22px 20px;
        width: 85%;
        max-width: 280px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.18);
        text-align: center;
        animation: popIn 0.2s ease;
      }

      @keyframes popIn {
        from { transform: scale(0.92); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
      }

      .modal-icon {
        font-size: 28px;
        margin-bottom: 10px;
      }

      .modal-title {
        font-size: 15px;
        font-weight: 600;
        color: #333;
        margin-bottom: 6px;
      }

      .modal-text {
        font-size: 13px;
        color: #777;
        margin-bottom: 18px;
        line-height: 1.4;
      }

      .modal-btns {
        display: flex;
        gap: 8px;
      }

      .modal-btn {
        flex: 1;
        padding: 9px 14px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        border: none;
        transition: background 0.2s;
        font-family: inherit;
      }

      .modal-btn.cancel {
        background: #f3f4f6;
        color: #555;
      }

      .modal-btn.cancel:hover { background: #e5e7eb; }

      .modal-btn.danger {
        background: #ef4444;
        color: #fff;
      }

      .modal-btn.danger:hover { background: #dc2626; }
    </style>
  </head>
  <body>
    <div class="chat-container">
      <!-- Header (hidden automatically in widget/iframe mode) -->
      <div class="chat-header">
        <div class="header-left">
          <div class="avatar-container">
            <img
              src="https://raw.githubusercontent.com/Eriayomide/vreg-chatbot/main/ada_avatar.png"
              alt="Tosan"
              onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
            />
            <div class="avatar-fallback" style="display: none">T</div>
          </div>
          <div class="header-info">
            <h1>Tosan - IDEC Support</h1>
            <p>
              <span class="status-dot" id="connection-status"></span>
              <span id="status-text">Online</span>
            </p>
          </div>
        </div>
        <button class="reset-btn" onclick="showResetConfirm()">
          Reset Chat
        </button>
      </div>

      <!-- Messages -->
      <div class="messages-area" id="messages-container"></div>

      <!-- Input -->
      <div class="input-bar">
        <div class="input-row">
          <input
            type="text"
            id="user-input"
            placeholder="Type your message..."
            autocomplete="off"
          />
          <button id="send-btn" onclick="sendMessage()">
            <svg
              width="17"
              height="17"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
            >
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>
      </div>

      <!-- Powered-by (only visible in widget mode) -->
      <div class="powered-by">Powered by Tosan &middot; IDEC Support</div>

      <!-- Custom Reset Modal (replaces native confirm — no IP leak) -->
      <div class="modal-overlay" id="modal-overlay">
        <div class="modal-box">
          <div class="modal-icon">🔄</div>
          <div class="modal-title">Reset Chat?</div>
          <div class="modal-text">
            This will clear your conversation and start fresh.
          </div>
          <div class="modal-btns">
            <button class="modal-btn cancel" onclick="hideResetConfirm()">
              Cancel
            </button>
            <button class="modal-btn danger" onclick="confirmReset()">
              Reset
            </button>
          </div>
        </div>
      </div>
    </div>

    <script>
      /* ── Config ───────────────────────────────────── */
      var API_BASE_URL =
        window.location.hostname === "localhost"
          ? "http://localhost:8002"
          : "";

      var AVATAR_IMAGE =
        "https://raw.githubusercontent.com/Eriayomide/vreg-chatbot/main/ada_avatar.png";

      /* ── Lightweight Markdown → HTML parser ─────── */
      function parseMarkdown(text) {
        if (!text) return text;
        // Protect existing HTML tags (links from backend)
        var savedLinks = [];
        var s = text.replace(/<a\b[^>]*>.*?<\/a>/gi, function (match) {
          savedLinks.push(match);
          return "%%LINK" + (savedLinks.length - 1) + "%%";
        });
        // Bold: **text** or __text__
        s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
        s = s.replace(/__(.+?)__/g, "<strong>$1</strong>");
        // Italic: *text* or _text_ (but not inside words)
        s = s.replace(/(?<!\w)\*([^*]+?)\*(?!\w)/g, "<em>$1</em>");
        s = s.replace(/(?<!\w)_([^_]+?)_(?!\w)/g, "<em>$1</em>");
        // Numbered lists: "1. item" at start of line
        s = s.replace(/(\d+)\.\s+/g, "<br>$1. ");
        // Line breaks
        s = s.replace(/\n/g, "<br>");
        // Restore protected links
        for (var i = 0; i < savedLinks.length; i++) {
          s = s.replace("%%LINK" + i + "%%", savedLinks[i]);
        }
        // Clean up leading <br>
        s = s.replace(/^(<br>)+/, "");
        return s;
      }

      /* ── Detect iframe (widget) mode ───────────── */
      (function detectIframe() {
        try {
          if (window.self !== window.top) {
            document.body.classList.add("in-iframe");
          }
        } catch (e) {
          document.body.classList.add("in-iframe");
        }
      })();

      /* ── State ──────────────────────────────────── */
      var conversationId =
        localStorage.getItem("idec_conversation_id") || null;
      var currentUserName = null;

      /* ── Connection status ──────────────────────── */
      function updateConnectionStatus(ok) {
        var dot = document.getElementById("connection-status");
        var txt = document.getElementById("status-text");
        if (!dot || !txt) return;
        if (ok) {
          dot.classList.remove("off");
          txt.textContent = "Online";
        } else {
          dot.classList.add("off");
          txt.textContent = "Offline";
        }
      }

      /* ── Custom confirm modal ───────────────────── */
      function showResetConfirm() {
        document.getElementById("modal-overlay").classList.add("active");
      }

      function hideResetConfirm() {
        document.getElementById("modal-overlay").classList.remove("active");
      }

      function confirmReset() {
        hideResetConfirm();
        resetChat();
      }

      /* ── Add message to chat ────────────────────── */
      function addMessage(type, content) {
        var c = document.getElementById("messages-container");
        var row = document.createElement("div");
        row.className = "msg " + type;

        if (type === "bot") {
          var av = document.createElement("div");
          av.className = "bot-av";
          av.innerHTML =
            '<img src="' +
            AVATAR_IMAGE +
            '" alt="T" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">' +
            '<div class="bot-av-fb" style="display:none">T</div>';
          row.appendChild(av);
        }

        var bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.innerHTML = type === "bot" ? parseMarkdown(content) : content;
        row.appendChild(bubble);
        c.appendChild(row);
        c.scrollTop = c.scrollHeight;
      }

      function addSystemMessage(content) {
        var c = document.getElementById("messages-container");
        var row = document.createElement("div");
        row.className = "msg system";
        var bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = content;
        row.appendChild(bubble);
        c.appendChild(row);
        c.scrollTop = c.scrollHeight;
      }

      /* ── Typing indicator ───────────────────────── */
      function showTyping() {
        var c = document.getElementById("messages-container");
        var row = document.createElement("div");
        row.className = "msg bot";
        row.id = "typing-row";

        var av = document.createElement("div");
        av.className = "bot-av";
        av.innerHTML =
          '<img src="' +
          AVATAR_IMAGE +
          '" alt="T" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">' +
          '<div class="bot-av-fb" style="display:none">T</div>';
        row.appendChild(av);

        var dots = document.createElement("div");
        dots.className = "typing-dots";
        dots.innerHTML = "<span></span><span></span><span></span>";
        row.appendChild(dots);

        c.appendChild(row);
        c.scrollTop = c.scrollHeight;
      }

      function hideTyping() {
        var el = document.getElementById("typing-row");
        if (el) el.remove();
      }

      /* ── Restore conversation ───────────────────── */
      async function restoreConversation() {
        if (!conversationId) return false;

        try {
          var res = await fetch(API_BASE_URL + "/get-conversation", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ conversation_id: conversationId }),
          });
          var data = await res.json();

          if (data.success && data.messages && data.messages.length > 0) {
            currentUserName = data.user_name;
            document.getElementById("messages-container").innerHTML = "";
            data.messages.forEach(function (m) {
              addMessage(
                m.role === "user" ? "user" : "bot",
                m.content
              );
            });
            return true;
          }
          return false;
        } catch (e) {
          console.error("Restore error:", e);
          return false;
        }
      }

      /* ── Send message ───────────────────────────── */
      async function sendMessage() {
        var input = document.getElementById("user-input");
        var btn = document.getElementById("send-btn");
        var message = input.value.trim();
        if (!message) return;

        input.disabled = true;
        btn.disabled = true;

        addMessage("user", message);
        input.value = "";
        showTyping();

        try {
          var res = await fetch(API_BASE_URL + "/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              message: message,
              conversation_id: conversationId,
            }),
          });

          if (!res.ok) throw new Error("HTTP " + res.status);

          var data = await res.json();
          updateConnectionStatus(true);

          if (data.conversation_id) {
            conversationId = data.conversation_id;
            localStorage.setItem("idec_conversation_id", conversationId);
          }

          if (data.user_name) currentUserName = data.user_name;

          hideTyping();
          addMessage("bot", data.reply || data.raw_reply);
        } catch (err) {
          console.error("Send error:", err);
          updateConnectionStatus(false);
          hideTyping();

          if (
            err.message.includes("Failed to fetch") ||
            err.message.includes("NetworkError")
          ) {
            addMessage(
              "bot",
              "Can't reach the server right now. Please check your connection and try again."
            );
          } else {
            addMessage(
              "bot",
              "Something went wrong. Please try again."
            );
          }
        } finally {
          input.disabled = false;
          btn.disabled = false;
          input.focus();
        }
      }

      /* ── Reset chat (no native confirm!) ─────────── */
      async function resetChat() {
        try {
          if (conversationId) {
            await fetch(API_BASE_URL + "/reset-session", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ conversation_id: conversationId }),
            });
          }

          localStorage.removeItem("idec_conversation_id");
          conversationId = null;
          currentUserName = null;
          document.getElementById("messages-container").innerHTML = "";
          addMessage(
            "bot",
            "Hello! I'm Tosan, your IDEC support assistant. What's your name?"
          );
        } catch (e) {
          console.error("Reset error:", e);
          addSystemMessage("Reset failed. Refresh the page to start fresh.");
        }
      }

      /* ── Health check ───────────────────────────── */
      async function testConnection() {
        try {
          var res = await fetch(API_BASE_URL + "/health");
          await res.json();
          updateConnectionStatus(true);
          return true;
        } catch (e) {
          console.error("Health check failed:", e);
          updateConnectionStatus(false);
          return false;
        }
      }

      /* ── Enter key ──────────────────────────────── */
      document
        .getElementById("user-input")
        .addEventListener("keypress", function (e) {
          if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
          }
        });

      /* ── Close modal on overlay click ───────────── */
      document
        .getElementById("modal-overlay")
        .addEventListener("click", function (e) {
          if (e.target === this) hideResetConfirm();
        });

      /* ── Init ───────────────────────────────────── */
      window.addEventListener("load", async function () {
        var ok = await testConnection();
        if (ok) {
          var restored = await restoreConversation();
          if (!restored) {
            setTimeout(function () {
              addMessage(
                "bot",
                "Hello! I'm Tosan, your IDEC support assistant. What's your name?"
              );
            }, 400);
          }
        }
      });
    </script>
  </body>
</html>
